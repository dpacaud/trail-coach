[project]
name = "trailcoach"
version = "0.1.0"
description = "Lecture Strava et Garmin FIT, et methode de construction d'un plan de preparation trail"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "fitparse>=1.2",
    "python-dateutil>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailcoach"]
